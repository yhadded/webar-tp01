<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Exercice 5 - QR code + Marqueur Hiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!--
    Cette page EST la cible du QR code (voir assets/qr-with-hiro.png, généré par
    generate_qr.py). Le QR code contient le marqueur Hiro imprimé en son centre :

      1. On scanne le QR code avec l'appareil photo du téléphone -> le lien ouvre
         cette page (index.html) dans le navigateur.
      2. On pointe ensuite la caméra WebAR (celle de cette page) vers CE MÊME QR
         code -> AR.js reconnaît le motif Hiro au centre et affiche la boîte.

    Le marqueur reste détectable car le QR est généré en correction d'erreur "H"
    (~30% de tolérance) et le Hiro n'occupe que ~22% de la surface centrale.
  -->
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">

    <a-marker preset="hiro">
      <!-- "au centre" : la boîte est centrée sur l'origine du marqueur (0,0,0) -->
      <a-box
        position="0 0.5 0"
        color="#4CC9F0"
        opacity="0.85"
        transparent="true"
        depth="1" height="1" width="1"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
